[package]
name = "termania"
version = "0.1.0"
edition = "2021"
description = "A multi-window grid terminal emulator with large font support and text tap API"
license = "MIT"

[[bin]]
name = "termania"
path = "src/main.rs"

[dependencies]
# Window and event loop
winit = "0.30"

# GPU rendering
wgpu = "23"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"

# Font handling
cosmic-text = "0.12"
ttf-parser = "0.20"

# Terminal emulation
vte = "0.13"

# PTY management (direct libc for fork/exec/pty)
libc = "0.2"

# Configuration
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"

# HTTP client (sync, for LLM API calls)
ureq = { version = "3", features = ["json"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Image encoding (for screenshot feature)
image = { version = "0.24", default-features = false, features = ["png"] }

# Clipboard support
arboard = "3"

# macOS native views (WebView, Notes plugins)
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSURLRequest", "NSGeometry"] }
objc2-app-kit = { version = "0.3", features = ["NSView", "NSColor", "NSFont", "NSScrollView", "NSTextView", "NSText", "NSResponder", "NSWindow"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKWebViewConfiguration", "WKNavigation"] }

[profile.release]
opt-level = 3
lto = "thin"
